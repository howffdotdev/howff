name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  entries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run validate
      - run: npm run build
